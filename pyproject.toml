[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opik-to-bt"
version = "0.1.0"
description = "Migrate Opik datasets, experiments, and traces to Braintrust"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Braintrust" }]
dependencies = [
  "opik>=2.2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14.1,<15",
  "typer>=0.16,<1",
]

[project.scripts]
opik-to-bt = "opik_to_bt.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opik_to_bt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
